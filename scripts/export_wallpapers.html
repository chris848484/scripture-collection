<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>말씀 배경화면 파일 만들기</title>
  <style>
    :root { color-scheme:light; font-family:system-ui,"Malgun Gothic",sans-serif; color:#243b65; background:#f3f6fb; }
    * { box-sizing:border-box; }
    body { max-width:840px; margin:0 auto; padding:32px 24px; line-height:1.65; }
    h1 { margin-top:0; font-size:1.7rem; }
    button { font:inherit; padding:12px 20px; color:white; background:#243b65; border:0; border-radius:8px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    progress { display:block; width:100%; height:24px; margin-top:24px; }
    #status { font-weight:700; }
    #status[data-state="error"] { color:#a02525; }
    dl { display:flex; flex-wrap:wrap; gap:20px 32px; }
    dl div { min-width:100px; }
    dt { font-size:.875rem; color:#5c677a; }
    dd { margin:0; font-variant-numeric:tabular-nums; font-weight:700; }
    #log { background:#fff; border:1px solid #dee4ed; border-radius:8px; padding:16px; max-height:420px; overflow:auto; font-size:.875rem; }
    #log p { margin:0 0 5px; }
    code { overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <h1>말씀 배경화면 파일 만들기</h1>
  <p>현재 렌더러로 75개의 말씀을 순서대로 그립니다. 완성된 PNG는 이 프로젝트의 <code>wallpapers/verse-01.png</code>부터 <code>verse-75.png</code>까지 저장합니다.</p>
  <p>해상도는 1440 × 3120입니다. 완료될 때까지 이 페이지를 열어 두세요. 다시 실행하면 같은 이름의 파일을 갱신합니다.</p>
  <button id="start-export" type="button">배경화면 파일 만들기</button>
  <progress id="progress" max="75" value="0" aria-label="배경화면 생성 진행률"></progress>
  <p id="status" data-state="idle" role="status" aria-live="polite">준비되었습니다.</p>
  <dl>
    <div><dt>저장한 파일</dt><dd id="completed-count">0 / 75개</dd></div>
    <div><dt>전체 파일 크기</dt><dd id="total-bytes">0 MB</dd></div>
    <div><dt>걸린 시간</dt><dd id="elapsed-seconds">0.0초</dd></div>
  </dl>
  <div id="log" aria-label="생성 기록"></div>
  <script id="wallpaper-background-data" type="text/plain">/wallpaper-background.png</script>
  <script src="/wallpaper.js"></script>
  <script>
    (() => {
      'use strict';
      const EXPECTED_COUNT = 75;
      const MAX_PNG_BYTES = 15000000;
      const button = document.getElementById('start-export');
      const status = document.getElementById('status');
      const progress = document.getElementById('progress');
      const log = document.getElementById('log');
      let running = false;
      const formatBytes = bytes => (bytes / 1000000).toFixed(2) + ' MB';

      button.addEventListener('click', async () => {
        if (running) return;
        running = true;
        button.disabled = true;
        progress.value = 0;
        log.replaceChildren();
        status.dataset.state = 'running';
        status.textContent = '말씀 데이터를 읽고 있습니다.';
        const start = performance.now();
        const result = { status:'running', completed:0, total:EXPECTED_COUNT, bytes:0, elapsedSeconds:0, files:[] };
        window.wallpaperExportResult = result;
        const updateStats = () => {
          result.elapsedSeconds = (performance.now() - start) / 1000;
          document.getElementById('completed-count').textContent = result.completed + ' / ' + EXPECTED_COUNT + '개';
          document.getElementById('total-bytes').textContent = formatBytes(result.bytes);
          document.getElementById('elapsed-seconds').textContent = result.elapsedSeconds.toFixed(1) + '초';
          progress.value = result.completed;
        };
        updateStats();
        const timer = setInterval(updateStats, 250);
        try {
          if (location.origin !== 'http://127.0.0.1:8765') {
            throw new Error('http://127.0.0.1:8765/export-wallpapers.html 주소로 열어 주세요.');
          }
          if (!window.ScriptureWallpaper?.render) throw new Error('wallpaper.js 렌더러를 불러오지 못했습니다.');
          const contentResponse = await fetch('/content.json', { cache:'no-store' });
          if (!contentResponse.ok) throw new Error('말씀 데이터를 불러오지 못했습니다: HTTP ' + contentResponse.status);
          const content = await contentResponse.json();
          const scriptures = content.categories.flatMap(category => category.verses);
          if (scriptures.length !== EXPECTED_COUNT) throw new Error('말씀 수가 75개와 다릅니다: ' + scriptures.length);
          for (const [index, scripture] of scriptures.entries()) {
            const filename = 'verse-' + String(index + 1).padStart(2, '0') + '.png';
            status.textContent = (index + 1) + ' / ' + EXPECTED_COUNT + ' 생성 중 · ' + scripture.reference;
            const rendered = await window.ScriptureWallpaper.render(scripture);
            if (rendered.width !== 1440 || rendered.height !== 3120) throw new Error(filename + ': 해상도가 1440 × 3120이 아닙니다.');
            if (!(rendered.blob instanceof Blob) || rendered.blob.type !== 'image/png') throw new Error(filename + ': PNG를 만들지 못했습니다.');
            if (rendered.blob.size > MAX_PNG_BYTES) throw new Error(filename + ': 15 MB를 초과했습니다.');
            const response = await fetch('/__wallpaper-export/' + filename, {
              method:'POST',
              headers:{ 'Content-Type':'image/png' },
              body:rendered.blob,
            });
            const saved = await response.json();
            if (!response.ok || !saved.ok) throw new Error(filename + ': ' + (saved.error || 'HTTP ' + response.status));
            if (saved.filename !== filename || saved.bytes !== rendered.blob.size) throw new Error(filename + ': 저장 결과가 생성한 파일과 다릅니다.');
            result.completed += 1;
            result.bytes += saved.bytes;
            result.files.push({
              filename, reference:scripture.reference, bytes:saved.bytes,
              width:rendered.width, height:rendered.height,
              fontSize:rendered.layout.fontSize,
              lineCount:rendered.layout.paragraphs.reduce((sum, paragraph) => sum + paragraph.lines.length, 0),
            });
            updateStats();
            const entry = document.createElement('p');
            entry.textContent = result.completed + '. ' + filename + ' · ' + scripture.reference + ' · ' + formatBytes(saved.bytes);
            log.append(entry);
            log.scrollTop = log.scrollHeight;
            status.textContent = result.completed + ' / ' + EXPECTED_COUNT + ' 저장 완료 · ' + scripture.reference;
          }
          result.status = 'complete';
          status.dataset.state = 'complete';
          updateStats();
          status.textContent = '완료 · ' + result.completed + '개 · ' + formatBytes(result.bytes) + ' · ' + result.elapsedSeconds.toFixed(1) + '초';
        } catch (error) {
          result.status = 'error';
          result.error = error instanceof Error ? error.message : String(error);
          status.dataset.state = 'error';
          status.textContent = '중단 · ' + result.completed + ' / ' + EXPECTED_COUNT + ' 저장됨 · ' + result.error;
        } finally {
          clearInterval(timer);
          updateStats();
          running = false;
          button.disabled = false;
          button.textContent = '배경화면 파일 만들기';
        }
      });
    })();
  </script>
</body>
</html>
